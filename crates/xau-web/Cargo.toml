[package]
name = "xau-web"
version = "1.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The web version of the app: a local server and a browser UI over the same core as the Android app"

[[bin]]
name = "xau-web"
path = "src/main.rs"

[dependencies]
xau-api = { path = "../xau-api" }
xau-mobile = { path = "../xau-mobile" }
xau-core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true, features = ["ws"] }
getrandom = "0.2"
base64 = "0.22"
# The core's HTTP clients read the proxy from the environment; this lets that be a SOCKS5 one (WARP).
reqwest = { workspace = true, features = ["socks"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
tao = "0.36.0"
wry = "0.48.1"
# The same versions wry itself uses, for the DevTools calls that stream the sign-in page.
webview2-com = "0.34"
windows = "0.58"
